<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Timeline Viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="controls">
      <h1>Google Timeline Viewer</h1>
      <p class="intro">View a Google Maps Timeline export locally over OpenStreetMap.</p>

      <label class="file-label">
        Timeline JSON
        <input id="file-input" type="file" accept=".json,application/json">
      </label>
      <button id="load-default" type="button">Load local data/Timeline.json</button>

      <div class="field-row">
        <label>
          From
          <input id="start-time" type="datetime-local" step="1">
        </label>
        <label>
          To
          <input id="end-time" type="datetime-local" step="1">
        </label>
      </div>

      <div class="button-row">
        <button id="apply-filter" type="button" disabled>Apply filter</button>
        <button id="full-range" type="button" disabled>Full range</button>
      </div>

      <fieldset>
        <legend>Layers</legend>
        <label class="checkbox"><input id="show-paths" type="checkbox" checked> Timeline paths</label>
        <label class="checkbox"><input id="show-raw" type="checkbox" checked> Raw positions</label>
      </fieldset>

      <button id="fit-traces" type="button" disabled>Fit visible traces</button>

      <dl class="stats">
        <div><dt>Timeline paths</dt><dd id="path-count">–</dd></div>
        <div><dt>Raw positions</dt><dd id="raw-count">–</dd></div>
        <div><dt>Visible points</dt><dd id="visible-count">–</dd></div>
      </dl>

      <details class="perf-panel" open>
        <summary>Performance</summary>
        <pre id="perf-log">Waiting for measurements…</pre>
      </details>

      <p id="status" class="status" aria-live="polite">Loading local Timeline export…</p>
      <p class="privacy">The JSON is processed entirely in your browser. It is not uploaded by this app.</p>
    </aside>

    <main id="map" aria-label="Timeline map"></main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
